[project]
name = "prazo-juridico-py"
version = "0.1.0"
description = "Calculadora de prazos processuais conforme o CPC (Lei nº 13.105/2015)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anna Klara" }]

[project.scripts]
prazo-juridico = "prazo_juridico.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prazo_juridico*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
