[project]
name = "scanner-seguranca-py"
version = "0.1.0"
description = "Ferramenta básica de diagnóstico de segurança (portas, cabeçalhos HTTP e TLS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anna Klara" }]

[project.scripts]
scanner-seguranca = "scanner_seguranca.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scanner_seguranca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
